{% if site.adsense.enabled and site.adsense.client %}
  <!-- Google AdSense - Post Top -->
  <div class="adsense-wrapper adsense-post-top my-4">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="{{ site.adsense.client }}"
         {% if site.adsense.slots.post_top and site.adsense.slots.post_top != "" %}
         data-ad-slot="{{ site.adsense.slots.post_top }}"
         {% endif %}
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>
{% elsif site.adsense.display_sample %}
  <!-- AdSense Placeholder Guide (Visible during preview / setup) -->
  <div class="adsense-placeholder-guide my-4 p-3 text-center rounded border border-secondary-subtle" style="background-color: var(--card-bg, rgba(125, 125, 125, 0.05)); border-style: dashed !important;">
    <div class="small fw-semibold text-muted mb-1">
      <i class="fa-solid fa-rectangle-ad me-1 text-primary"></i> Google AdSense — 본문 상단 광고 슬롯
    </div>
    <div class="small text-muted opacity-75" style="font-size: 0.8rem;">
      <code>_config.yml</code>의 <code>adsense.enabled: true</code> 설정 시 실제 광고로 대체됩니다.
    </div>
  </div>
{% endif %}
