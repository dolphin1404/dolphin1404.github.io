<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Hermes skill review decision flow</title>
  <desc id="desc">A minimal flowchart of learning signals, validation gates, and skill update actions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#777"/></marker>
    <style>.title{font:600 25px Pretendard,Arial,sans-serif;fill:#222}.sub{font:14px Pretendard,Arial,sans-serif;fill:#666}.head{font:600 15px Pretendard,Arial,sans-serif;fill:#222}.label{font:600 16px Pretendard,Arial,sans-serif;fill:#222}.body{font:14px Pretendard,Arial,sans-serif;fill:#555}.box{fill:#fff;stroke:#777;stroke-width:1.3}.dash{fill:#fff;stroke:#999;stroke-width:1.2;stroke-dasharray:7 6}.line{fill:none;stroke:#777;stroke-width:1.3;marker-end:url(#arrow)}.accent{fill:#e65345;stroke:#bf3d33;stroke-width:1.2}.yn{font:700 12px Pretendard,Arial,sans-serif;fill:#bf3d33}</style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="60" y="58" class="title">Skill Review — Decision Flow</text>
  <text x="60" y="84" class="sub">Only reusable, verified, and writable knowledge becomes a skill.</text>

  <rect x="45" y="120" width="255" height="545" rx="12" class="dash"/>
  <text x="65" y="151" class="head">1. Signals from conversation</text>
  <g>
    <rect x="70" y="182" width="205" height="72" rx="5" class="box"/><circle cx="93" cy="218" r="10" class="accent"/><text x="115" y="213" class="label">User correction</text><text x="115" y="234" class="body">style, format, workflow</text>
    <rect x="70" y="278" width="205" height="72" rx="5" class="box"/><circle cx="93" cy="314" r="10" class="accent"/><text x="115" y="309" class="label">Working technique</text><text x="115" y="330" class="body">fix, workaround, debug path</text>
    <rect x="70" y="374" width="205" height="72" rx="5" class="box"/><circle cx="93" cy="410" r="10" class="accent"/><text x="115" y="405" class="label">Outdated skill</text><text x="115" y="426" class="body">missing or incorrect step</text>
    <rect x="70" y="470" width="205" height="72" rx="5" class="box"/><circle cx="93" cy="506" r="10" class="accent"/><text x="115" y="501" class="label">Repeatable success</text><text x="115" y="522" class="body">useful in a future session</text>
  </g>
  <path d="M300 374H382" class="line"/>

  <rect x="382" y="120" width="355" height="545" rx="12" class="dash"/>
  <text x="402" y="151" class="head">2. Validation gates</text>
  <path d="M560 183l112 70-112 70-112-70z" class="box"/><text x="560" y="247" text-anchor="middle" class="label">Did it work?</text><text x="560" y="270" text-anchor="middle" class="body">Evidence, not a guess</text>
  <path d="M560 349l112 70-112 70-112-70z" class="box"/><text x="560" y="413" text-anchor="middle" class="label">Is it durable?</text><text x="560" y="436" text-anchor="middle" class="body">Not a one-off failure</text>
  <path d="M560 515l112 70-112 70-112-70z" class="box"/><text x="560" y="579" text-anchor="middle" class="label">Can it be edited?</text><text x="560" y="602" text-anchor="middle" class="body">Ownership and pin rules</text>
  <path d="M560 323V349" class="line"/><path d="M560 489V515" class="line"/><text x="572" y="340" class="yn">YES</text><text x="572" y="506" class="yn">YES</text>

  <rect x="785" y="120" width="370" height="545" rx="12" class="dash"/>
  <text x="805" y="151" class="head">3. Result</text>
  <rect x="820" y="186" width="295" height="90" rx="5" class="box"/><text x="967" y="222" text-anchor="middle" class="label">Do not save</text><text x="967" y="246" text-anchor="middle" class="body">Unresolved or unverified attempts</text>
  <rect x="820" y="328" width="295" height="90" rx="5" class="box"/><text x="967" y="364" text-anchor="middle" class="label">Do not save</text><text x="967" y="388" text-anchor="middle" class="body">Transient environment state</text>
  <rect x="820" y="470" width="295" height="90" rx="5" class="box"/><text x="967" y="506" text-anchor="middle" class="label">Do not modify</text><text x="967" y="530" text-anchor="middle" class="body">Bundled, Hub, pinned, user-owned</text>
  <path d="M672 253H820" class="line"/><path d="M672 419H820" class="line"/><path d="M672 585H760V515H820" class="line"/><text x="700" y="243" class="yn">NO</text><text x="700" y="409" class="yn">NO</text><text x="700" y="575" class="yn">NO</text>

  <path d="M560 655V688H770V627H820" class="line"/><text x="575" y="680" class="yn">YES</text>
  <rect x="820" y="590" width="295" height="74" rx="5" class="accent"/>
  <text x="967" y="619" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Update the skill library</text>
  <text x="967" y="643" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="14" fill="#fff">patch → support file → create</text>
  <text x="600" y="718" text-anchor="middle" class="sub">Preference order: loaded skill → existing umbrella → reference/template/script → new class-level skill</text>
</svg>
