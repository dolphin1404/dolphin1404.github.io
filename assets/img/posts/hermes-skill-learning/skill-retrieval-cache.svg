<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Hermes 스킬 검색과 캐시 경로</title>
  <desc id="desc">SKILL.md가 manifest와 두 단계 cache를 거쳐 compact index가 되고, 모델이 skill_view로 전체 내용을 읽는 흐름이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#777"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#e65345"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Pretendard Variable","Noto Sans KR",Arial,sans-serif;fill:#222}
      .title{font-size:27px;font-weight:700}
      .section{font-size:14px;font-weight:700;letter-spacing:.12em;fill:#777}
      .label{font-size:17px;font-weight:650}
      .small{font-size:13px;font-weight:500;fill:#666}
      .white{fill:#fff}
      .box{fill:#fff;stroke:#777;stroke-width:1.35}
      .soft{fill:#f7f7f7;stroke:#777;stroke-width:1.35}
      .accent{fill:#e65345;stroke:#c84338;stroke-width:1.35}
      .line{fill:none;stroke:#777;stroke-width:1.45;marker-end:url(#arrow)}
      .learn{fill:none;stroke:#e65345;stroke-width:1.65;marker-end:url(#arrow-red)}
    </style>
  </defs>

  <rect width="1200" height="700" fill="#fff"/>
  <text x="60" y="56" class="title">Skill Retrieval — Index First</text>

  <text x="60" y="110" class="section">BUILD THE INDEX</text>
  <rect x="60" y="140" width="200" height="90" rx="5" class="box"/>
  <text x="160" y="174" text-anchor="middle" class="label">Skill Directories</text>
  <text x="160" y="201" text-anchor="middle" class="small">SKILL.md</text>

  <path d="M260 185H300" class="line"/>
  <rect x="300" y="140" width="200" height="90" rx="5" class="soft"/>
  <text x="400" y="174" text-anchor="middle" class="label">Manifest</text>
  <text x="400" y="201" text-anchor="middle" class="small">mtime + size</text>

  <path d="M500 185H540" class="line"/>
  <rect x="540" y="140" width="200" height="90" rx="5" class="soft"/>
  <text x="640" y="174" text-anchor="middle" class="label">Two-layer Cache</text>
  <text x="640" y="201" text-anchor="middle" class="small">LRU + disk snapshot</text>

  <path d="M740 185H800" class="learn"/>
  <rect x="800" y="140" width="340" height="90" rx="5" class="accent"/>
  <text x="970" y="174" text-anchor="middle" class="label white">Compact Skill Index</text>
  <text x="970" y="201" text-anchor="middle" class="small white">category · name · description</text>

  <text x="60" y="315" class="section">ROUTE AND LOAD</text>
  <rect x="60" y="345" width="200" height="90" rx="5" class="box"/>
  <text x="160" y="379" text-anchor="middle" class="label">사용자 요청</text>
  <text x="160" y="406" text-anchor="middle" class="small">현재 작업의 의미</text>

  <path d="M260 390H300" class="line"/>
  <rect x="300" y="345" width="200" height="90" rx="5" class="accent"/>
  <text x="400" y="379" text-anchor="middle" class="label white">Model Routing</text>
  <text x="400" y="406" text-anchor="middle" class="small white">request ↔ description</text>

  <path d="M500 390H540" class="line"/>
  <rect x="540" y="345" width="200" height="90" rx="5" class="box"/>
  <text x="640" y="379" text-anchor="middle" class="label">skill_view</text>
  <text x="640" y="406" text-anchor="middle" class="small">필요할 때 전체 읽기</text>

  <path d="M740 390H800" class="line"/>
  <rect x="800" y="345" width="340" height="90" rx="5" class="soft"/>
  <text x="970" y="379" text-anchor="middle" class="label">Full Procedural Context</text>
  <text x="970" y="406" text-anchor="middle" class="small">content · linked_files · setup status</text>

  <path d="M970 230V275H400V345" class="line"/>

  <text x="60" y="520" class="section">AFTER A SKILL WRITE</text>
  <rect x="60" y="550" width="200" height="78" rx="5" class="box"/>
  <text x="160" y="581" text-anchor="middle" class="label">skill_manage</text>
  <text x="160" y="605" text-anchor="middle" class="small">create · patch · edit</text>

  <path d="M260 589H300" class="learn"/>
  <rect x="300" y="550" width="200" height="78" rx="5" class="soft"/>
  <text x="400" y="581" text-anchor="middle" class="label">Index Cache 삭제</text>
  <text x="400" y="605" text-anchor="middle" class="small">LRU + disk snapshot</text>

  <path d="M500 589H540" class="line"/>
  <rect x="540" y="550" width="200" height="78" rx="5" class="soft"/>
  <text x="640" y="581" text-anchor="middle" class="label">현재 Prompt 유지</text>
  <text x="640" y="605" text-anchor="middle" class="small">cached system prompt</text>

  <path d="M740 589H800" class="learn"/>
  <rect x="800" y="550" width="340" height="78" rx="5" class="accent"/>
  <text x="970" y="581" text-anchor="middle" class="label white">다음 Rebuild에 반영</text>
  <text x="970" y="605" text-anchor="middle" class="small white">compression · restore · new session</text>
</svg>
