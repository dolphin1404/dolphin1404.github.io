<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Hermes 스킬 리뷰 카운터 상태 변화</title>
  <desc id="desc">모델 API 반복에서 카운터가 증가하고, 턴 경계에서는 유지되며, skill_manage 호출과 리뷰 예약에서 초기화되는 흐름이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#777"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#e65345"/>
    </marker>
    <style>
      text{font-family:Pretendard,"Pretendard Variable","Noto Sans KR",Arial,sans-serif;fill:#222}
      .title{font-size:27px;font-weight:700}
      .section{font-size:14px;font-weight:700;letter-spacing:.12em;fill:#777}
      .label{font-size:17px;font-weight:650}
      .small{font-size:13px;font-weight:500;fill:#666}
      .white{fill:#fff}
      .box{fill:#fff;stroke:#777;stroke-width:1.35}
      .soft{fill:#f7f7f7;stroke:#777;stroke-width:1.35}
      .accent{fill:#e65345;stroke:#c84338;stroke-width:1.35}
      .line{fill:none;stroke:#777;stroke-width:1.45;marker-end:url(#arrow)}
      .learn{fill:none;stroke:#e65345;stroke-width:1.65;marker-end:url(#arrow-red)}
    </style>
  </defs>

  <rect width="1200" height="700" fill="#fff"/>
  <text x="60" y="56" class="title">Cadence Counter — 상태 변화</text>

  <text x="60" y="110" class="section">EXAMPLE TRACE</text>
  <path d="M105 183H755" class="line"/>

  <text x="105" y="151" text-anchor="middle" class="small">init</text>
  <text x="235" y="151" text-anchor="middle" class="small">API call</text>
  <text x="365" y="151" text-anchor="middle" class="small">new turn</text>
  <text x="495" y="151" text-anchor="middle" class="small">API + 3 tools</text>
  <text x="625" y="151" text-anchor="middle" class="small">skill_manage</text>
  <text x="755" y="151" text-anchor="middle" class="small">final API</text>

  <circle cx="105" cy="183" r="7" fill="#777"/>
  <circle cx="235" cy="183" r="7" fill="#777"/>
  <circle cx="365" cy="183" r="7" fill="#777"/>
  <circle cx="495" cy="183" r="7" fill="#777"/>
  <circle cx="625" cy="183" r="7" fill="#e65345"/>
  <circle cx="755" cy="183" r="7" fill="#777"/>

  <rect x="65" y="220" width="80" height="56" rx="5" class="soft"/>
  <rect x="195" y="220" width="80" height="56" rx="5" class="soft"/>
  <rect x="325" y="220" width="80" height="56" rx="5" class="soft"/>
  <rect x="455" y="220" width="80" height="56" rx="5" class="soft"/>
  <rect x="585" y="220" width="80" height="56" rx="5" class="accent"/>
  <rect x="715" y="220" width="80" height="56" rx="5" class="soft"/>
  <text x="105" y="254" text-anchor="middle" class="label">c = 0</text>
  <text x="235" y="254" text-anchor="middle" class="label">c = 1</text>
  <text x="365" y="254" text-anchor="middle" class="label">c = 1</text>
  <text x="495" y="254" text-anchor="middle" class="label">c = 2</text>
  <text x="625" y="254" text-anchor="middle" class="label white">c = 0</text>
  <text x="755" y="254" text-anchor="middle" class="label">c = 1</text>

  <text x="60" y="325" class="small">한 번의 API 응답이 여러 tool call을 반환해도 표준 루프의 증가는 한 번이다.</text>

  <text x="60" y="405" class="section">REVIEW GATE</text>
  <rect x="60" y="440" width="210" height="78" rx="5" class="box"/>
  <text x="165" y="471" text-anchor="middle" class="label">turn_finalizer</text>
  <text x="165" y="496" text-anchor="middle" class="small">c ≥ N</text>

  <path d="M270 479H340" class="line"/>
  <rect x="340" y="440" width="250" height="78" rx="5" class="soft"/>
  <text x="465" y="471" text-anchor="middle" class="label">review_skills = True</text>
  <text x="465" y="496" text-anchor="middle" class="small">c ← 0</text>

  <path d="M590 479H660" class="learn"/>
  <rect x="660" y="440" width="160" height="78" rx="5" class="accent"/>
  <text x="740" y="471" text-anchor="middle" class="label white">Review Fork</text>
  <text x="740" y="496" text-anchor="middle" class="small white">생성 여부 판단</text>

  <text x="870" y="110" class="section">STATE RULES</text>
  <rect x="870" y="140" width="270" height="70" rx="5" class="soft"/>
  <text x="890" y="170" class="label">Model API loop</text>
  <text x="890" y="194" class="small">c ← c + 1</text>

  <rect x="870" y="235" width="270" height="70" rx="5" class="soft"/>
  <text x="890" y="265" class="label">New user turn</text>
  <text x="890" y="289" class="small">c 유지</text>

  <rect x="870" y="330" width="270" height="70" rx="5" class="accent"/>
  <text x="890" y="360" class="label white">skill_manage dispatch</text>
  <text x="890" y="384" class="small white">c ← 0</text>

  <rect x="870" y="425" width="270" height="70" rx="5" class="soft"/>
  <text x="890" y="455" class="label">New AIAgent</text>
  <text x="890" y="479" class="small">c ← 0</text>

  <text x="870" y="548" class="small">c는 같은 AIAgent의 턴 사이에서 유지된다.</text>
  <text x="870" y="572" class="small">디스크에 저장되는 상태는 아니다.</text>
</svg>
